<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-loop</title>
<!-- Suppresses the browser's automatic /favicon.ico request, which this server has no route for. -->
<link rel="icon" href="data:," />
<style>
  /* Modeled on Claude Code's terminal UI: warm dark background, one transcript column, tool calls as
     "⏺ Tool(args)" with "⎿" output, a permission prompt pinned to the bottom. */
  :root {
    color-scheme: dark;
    --bg: #1f1e1d; --panel: #262624; --panel-2: #2d2c29; --line: #3a3935;
    --text: #e8e6e3; --dim: #9a9893; --faint: #6f6d68;
    --accent: #d97757; --green: #4eba65; --red: #ff6b80; --yellow: #e5c07b; --blue: #b1b9f9; --cyan: #7ec4cf;
    --mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.55 var(--mono); display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; }

  /* header */
  header { display: flex; align-items: center; gap: 14px; padding: 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .brand { color: var(--accent); font-weight: 700; white-space: nowrap; }
  #task { flex: 1; min-width: 0; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat { color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--text); font-weight: 600; }
  #run-state { padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  #run-state.running { color: var(--accent); border-color: var(--accent); }
  #run-state.done { color: var(--green); border-color: var(--green); }
  #run-state.failed, #run-state.stopped { color: var(--red); border-color: var(--red); }
  #status { color: var(--dim); white-space: nowrap; }
  #status::before { content: "●"; margin-right: 5px; color: var(--faint); }
  #status.live::before { color: var(--green); }
  #status.down::before { color: var(--red); }

  /* phase stepper */
  #stepper { display: flex; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; }
  .step { display: flex; align-items: center; gap: 7px; padding: 3px 11px; border: 1px solid var(--line); border-radius: 14px; color: var(--faint); background: none; cursor: pointer; white-space: nowrap; }
  .step .icon { width: 12px; text-align: center; }
  .step[data-state="active"] { color: var(--accent); border-color: var(--accent); }
  /* A slow, independent breathe on the active phase's icon -- signals "still working" continuously
     between discrete WS events instead of the row looking frozen until the next one arrives. Kept
     visually distinct from data-waiting's glow (a different, more urgent signal: needs you). */
  .step[data-state="active"] .icon { animation: live-pulse 2.4s ease-in-out infinite; }
  .step[data-state="pass"] { color: var(--green); border-color: #4eba6566; }
  .step[data-state="fail"] { color: var(--red); border-color: #ff6b8066; }
  .step[data-state="skipped"] { color: var(--faint); border-style: dashed; }
  .step .badge { font-size: 11px; color: var(--yellow); }
  .step .cost { font-size: 11px; color: var(--dim); }
  /* Which phase has an approval waiting is visible on the stepper itself, not just at the bottom
     dock (which only ever shows one prompt at a time). Phases run strictly sequentially
     (pipeline.ts awaits each one before starting the next), so this only ever lights up the single
     active phase -- but that phase alone can have several calls waiting at once (real parallel tool
     use in one assistant turn each fires its own approval-request before any of them resolve), and
     the count badge is what actually surfaces that. Styled as a soft ambient glow in the same
     accent color already used throughout, not a hard outline -- present enough to catch the eye,
     quiet enough to sit next to five other steps without shouting. */
  .step[data-waiting="1"] { animation: pulse-glow 2.2s ease-in-out infinite; }
  .wait-badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 14px; height: 14px;
    padding: 0 3px; border-radius: 999px; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; line-height: 1;
  }

  /* body: transcript + side panel */
  .body { flex: 1; min-height: 0; display: flex; }
  #scroll { flex: 1; min-width: 0; overflow-y: auto; position: relative; }
  #transcript { max-width: 960px; margin: 0 auto; padding: 14px 22px 30px; }
  aside { width: 330px; flex: none; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 14px; }
  aside h3 { margin: 14px 0 6px; font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  aside h3:first-child { margin-top: 0; }
  .kv { display: flex; justify-content: space-between; color: var(--dim); }
  .kv b { color: var(--text); font-weight: 500; }
  .files div, .rule { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rule { color: var(--dim); }
  .files .w { color: var(--green); } .files .e { color: var(--yellow); }
  .muted { color: var(--faint); }
  #browser-panel { display: none; }
  #browser-panel.live { display: block; }
  #browser-panel img { width: 100%; border: 1px solid var(--line); border-radius: 4px; margin-top: 6px; cursor: zoom-in; background: #111; }
  #browser-panel .url { color: var(--cyan); word-break: break-all; }
  #browser-panel h3 { display: flex; align-items: center; gap: 6px; }
  .live-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--green); display: inline-block; animation: live-pulse 1.6s ease-in-out infinite; }
  .shot-main { animation: shot-flash .5s ease-out; }
  .shot-jump-live { margin-top: 6px; width: 100%; }
  /* A filmstrip of every snapshot taken this run, not just the latest -- the run is often over
     before anyone's looking, so a history to scrub back through matters as much as "live" does. */
  .shot-gallery { display: flex; gap: 4px; overflow-x: auto; margin-top: 6px; padding-bottom: 2px; }
  .shot-gallery img { width: 44px; height: 30px; object-fit: cover; flex: none; border-radius: 3px; border: 1px solid var(--line); cursor: pointer; opacity: .55; background: #111; }
  .shot-gallery img:hover { opacity: .85; }
  .shot-gallery img.sel { opacity: 1; border-color: var(--accent); }
  /* The desktop window's captures and approval prompts: same look as the browser's, plus a marker that shows
     exactly where an approved click would land on the window as it was captured. */
  #desktop-panel img.desk-main { width: 100%; margin-top: 6px; border-radius: 4px; border: 1px solid var(--line); background: #111; display: block; }
  .desk-gallery { display: flex; gap: 4px; overflow-x: auto; margin-top: 6px; padding-bottom: 2px; }
  .desk-gallery img { width: 44px; height: 30px; object-fit: cover; flex: none; border-radius: 3px; border: 1px solid var(--line); cursor: pointer; opacity: .55; background: #111; }
  .desk-gallery img:hover { opacity: .85; } .desk-gallery img.sel { opacity: 1; border-color: var(--accent); }
  .desk-shot { position: relative; display: inline-block; max-width: 100%; margin-top: 6px; line-height: 0; }
  .desk-shot img { display: block; max-width: 100%; max-height: 26vh; border: 1px solid var(--line); border-radius: 4px; background: #111; }
  .desk-mark { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 2px solid var(--red); border-radius: 999px; background: rgba(255, 107, 128, .28); box-shadow: 0 0 0 2px rgba(255, 255, 255, .75); pointer-events: none; }
  .desk-prompt { flex: 1; min-width: 0; }
  .desk-target { color: var(--dim); } .desk-action { margin: 4px 0; color: var(--text); }
  .desk-text { margin-top: 4px; padding: 4px 8px; border-left: 2px solid var(--accent); background: var(--panel-2); white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 1000px) { aside { display: none; } }

  /* transcript blocks */
  .blk { margin: 0 0 10px; padding-left: 20px; position: relative; white-space: pre-wrap; word-break: break-word; animation: blk-in .2s ease-out; }
  .blk::before { position: absolute; left: 0; top: 0; }
  .blk.text::before { content: "⏺"; color: var(--text); }
  .blk.tool::before { content: "⏺"; color: var(--accent); }
  .blk.tool.err::before, .blk.tool.denied::before { color: var(--red); }
  .blk.tool.ok::before { color: var(--green); }
  .blk.tool .name { font-weight: 700; }
  .blk.tool .args { color: var(--dim); }
  .out { color: var(--dim); margin-top: 1px; }
  .out .gut { color: var(--faint); }
  .out.err { color: var(--red); }
  .more { color: var(--faint); cursor: pointer; }
  .more:hover { color: var(--text); }
  .tag { font-size: 11px; padding: 0 6px; border-radius: 8px; margin-left: 6px; border: 1px solid var(--line); color: var(--dim); }
  .tag.wait { color: var(--yellow); border-color: var(--yellow); }
  .tag.ok { color: var(--green); border-color: #4eba6566; }
  .tag.no { color: var(--red); border-color: #ff6b8066; }
  .blk.thinking { color: var(--faint); font-style: italic; cursor: pointer; }
  .blk.thinking::before { content: "✻"; color: var(--accent); font-style: normal; }
  .blk.thinking .full { display: none; }
  .blk.thinking.open .full { display: block; } .blk.thinking.open .hint { display: none; }
  .phase-sep { display: flex; align-items: center; gap: 10px; color: var(--dim); margin: 22px 0 12px; }
  .phase-sep::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .phase-sep b { color: var(--accent); font-weight: 600; }
  .blk.verdict::before { content: "✓"; color: var(--green); }
  .blk.verdict.fail::before { content: "✗"; color: var(--red); }
  .blk.verdict .head { font-weight: 700; }
  .blk.verdict ul { margin: 2px 0 0; padding-left: 18px; white-space: normal; }
  .blk.verdict .blocking { color: var(--red); }
  .blk.overseer::before { content: "◆"; color: var(--blue); }
  .blk.overseer .act { color: var(--blue); font-weight: 700; }
  .blk.note::before { content: "※"; color: var(--yellow); }
  .blk.trusted::before { content: "✓"; color: var(--green); }
  .blk.run-end { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--panel); white-space: normal; }
  .blk.run-end::before { content: none; }
  .blk.run-end.done { border-color: #4eba6588; } .blk.run-end.failed, .blk.run-end.stopped { border-color: #ff6b8088; }
  .md code { background: var(--panel-2); padding: 0 4px; border-radius: 3px; }
  .md strong { color: #fff; }
  #jump { display: none; position: sticky; bottom: 10px; margin: 0 auto; width: max-content; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
  #jump.show { display: block; }

  /* bottom dock: permission prompt or status line + decision input. Translucent + blurred (macOS
     sheet/vibrancy style) rather than a flat opaque bar, so it reads as floating over the transcript
     instead of abruptly cutting it off when a prompt appears. */
  #dock {
    flex: none; padding: 10px 22px 12px;
    background: rgba(31, 30, 29, .74); border-top: 1px solid rgba(255, 255, 255, .08);
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  }
  #dock .inner { max-width: 960px; margin: 0 auto; }
  .prompt { border: 1px solid var(--blue); border-radius: 8px; padding: 10px 14px; animation: sheet-in .22s cubic-bezier(.16,1,.3,1); }
  .prompt .title { color: var(--blue); font-weight: 700; }
  .prompt .count { color: var(--dim); float: right; }
  .prompt .body { margin: 8px 0; padding: 8px 10px; background: var(--panel); border-radius: 6px; max-height: 34vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .prompt .body .add { color: var(--green); } .prompt .body .del { color: var(--red); }
  .prompt .why { color: var(--dim); }
  .prompt .q { margin: 8px 0 4px; }
  .opt { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 2px 0 2px 18px; position: relative; cursor: pointer; color: var(--dim); }
  .opt:hover, .opt.sel { color: var(--text); }
  .opt.sel::before { content: "❯"; position: absolute; left: 0; color: var(--blue); }
  .opt .k { color: var(--faint); }
  .feedback { display: none; margin-top: 6px; }
  .feedback.open { display: flex; gap: 8px; }
  .feedback input { flex: 1; }
  .hintline { color: var(--faint); margin-top: 6px; font-size: 12px; }
  .statusline { color: var(--dim); margin-bottom: 8px; min-height: 20px; }
  .statusline .spin { color: var(--accent); display: inline-block; width: 14px; }
  .inputrow { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .inputrow span { color: var(--dim); }
  input[type=text] { flex: 1; background: none; border: 0; outline: none; color: var(--text); font: inherit; }
  .inputrow:focus-within { border-color: var(--dim); }
  .smallbtn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; cursor: pointer; }
  #theme-toggle { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer; font: inherit; }

  /* ---------- "Desktop" theme: a lighter, Claude-Desktop-style chat-card look, opt-in via the
     header toggle (persisted in localStorage). Overriding the color/font custom properties above
     handles most of it for free, since body/header/stepper/aside/dock already read them; the rest
     is restyling the transcript's flat "⏺ line" blocks into rounded avatar-badge cards. */
  :root[data-theme="desktop"] {
    color-scheme: light;
    --bg: #f7f5f2; --panel: #ffffff; --panel-2: #efebe4; --line: #e6e0d6;
    --text: #2b2924; --dim: #6e685d; --faint: #a39c8c;
    --accent: #cc7c52; --green: #2f8f52; --red: #d64545; --yellow: #a9790a; --blue: #4f5fd1; --cyan: #1f8a92;
    --mono: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  :root[data-theme="desktop"] header { box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  :root[data-theme="desktop"] .brand { font-weight: 800; }
  :root[data-theme="desktop"] #stepper { box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  :root[data-theme="desktop"] .step { border-radius: 999px; background: var(--panel-2); }
  :root[data-theme="desktop"] .step[data-state="active"] { background: #fbe7dc; }
  :root[data-theme="desktop"] .step[data-state="pass"] { background: #e5f4ea; }
  :root[data-theme="desktop"] .step[data-state="fail"] { background: #fbe4e4; }
  :root[data-theme="desktop"] #transcript { max-width: 760px; }
  :root[data-theme="desktop"] .blk {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px 14px 48px; box-shadow: 0 1px 2px rgba(0,0,0,.03); margin-bottom: 14px;
  }
  :root[data-theme="desktop"] .blk::before {
    top: 14px; left: 14px; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
    background: var(--panel-2); color: var(--text);
  }
  :root[data-theme="desktop"] .blk.text::before { background: var(--accent); color: #fff; }
  :root[data-theme="desktop"] .blk.tool::before { background: #eceeff; color: var(--blue); }
  :root[data-theme="desktop"] .blk.tool.ok::before { background: #e5f4ea; color: var(--green); }
  :root[data-theme="desktop"] .blk.tool.err::before, :root[data-theme="desktop"] .blk.tool.denied::before { background: #fbe4e4; color: var(--red); }
  :root[data-theme="desktop"] .blk.verdict::before { background: #e5f4ea; color: var(--green); }
  :root[data-theme="desktop"] .blk.verdict.fail::before { background: #fbe4e4; color: var(--red); }
  :root[data-theme="desktop"] .blk.overseer::before { background: #eceeff; color: var(--blue); }
  :root[data-theme="desktop"] .blk.note::before { background: #fbf1d8; color: var(--yellow); }
  :root[data-theme="desktop"] .blk.trusted::before { background: #e5f4ea; color: var(--green); }
  :root[data-theme="desktop"] .blk.thinking { background: transparent; border: none; box-shadow: none; padding: 0 0 0 30px; }
  :root[data-theme="desktop"] .blk.thinking::before { position: absolute; background: none; width: auto; height: auto; border-radius: 0; top: 0; left: 0; font-size: 14px; }
  :root[data-theme="desktop"] .blk.run-end { padding: 14px 18px; }
  :root[data-theme="desktop"] .out { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
  :root[data-theme="desktop"] .tag { border-radius: 999px; }
  :root[data-theme="desktop"] #dock {
    background: rgba(247, 245, 242, .55); border-top: 1px solid rgba(0, 0, 0, .05);
    backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5);
  }
  :root[data-theme="desktop"] .prompt {
    border: 1px solid rgba(0, 0, 0, .06); border-radius: 18px;
    background: rgba(255, 255, 255, .72); box-shadow: 0 8px 30px rgba(0, 0, 0, .12);
    backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  }
  :root[data-theme="desktop"] .prompt .body { background: rgba(239, 235, 228, .75); }
  :root[data-theme="desktop"] .opt { border-radius: 10px; padding: 6px 10px 6px 26px; }
  :root[data-theme="desktop"] .opt:hover, :root[data-theme="desktop"] .opt.sel { background: var(--panel-2); }
  :root[data-theme="desktop"] .inputrow { border-radius: 999px; background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.06); border-color: transparent; }
  :root[data-theme="desktop"] aside { border-left: none; box-shadow: -1px 0 3px rgba(0,0,0,.03); }

  /* ---------- motion: smooth without being distracting. New blocks and the permission sheet ease
     in instead of popping; interactive elements transition instead of snapping; switching themes
     cross-fades the colors instead of flashing. All of it collapses to nothing for anyone who's
     asked their OS for reduced motion. */
  @keyframes blk-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0); } 50% { box-shadow: 0 0 10px 1px rgba(217, 119, 87, .38); } }
  .step[data-waiting="1"] { border-color: var(--accent); }
  /* The exact tool call a pending approval is for, highlighted in the transcript -- not just the
     stepper badge and the bottom dock, so it's unambiguous which line an approval belongs to even
     with several tool calls on screen. A thin accent-colored bar that gently breathes, not a ring
     around the whole line -- present, not loud. */
  .blk.tool.awaiting { animation: blk-in .2s ease-out, pulse-glow-blk 2.2s ease-in-out infinite; }
  @keyframes pulse-glow-blk { 0%, 100% { box-shadow: -2px 0 0 0 rgba(217, 119, 87, .5); } 50% { box-shadow: -2px 0 8px 1px rgba(217, 119, 87, .38); } }
  /* The browser panel's "live" dot and the brief flash on its main image when a new snapshot lands
     -- shot-main is a fresh DOM node on every render (innerHTML is rebuilt wholesale), so this
     animation replays automatically each time without any manual class-toggling JS, the same trick
     .blk's own blk-in entrance animation already relies on. */
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes shot-flash { from { filter: brightness(1.6); } to { filter: brightness(1); } }
  html { transition: background-color .25s ease; }
  body, header, #stepper, aside, #dock, .step, .blk, .tag, .opt, .smallbtn, #theme-toggle,
  #run-state, .inputrow, #jump {
    transition: background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
  }
  .step, .opt, .smallbtn, #theme-toggle, #jump, button {
    transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .step:hover { transform: translateY(-1px); }
  .opt:active, .smallbtn:active, #theme-toggle:active { transform: scale(.96); }
  #theme-toggle { transition: background-color .15s ease, transform .15s ease, opacity .15s ease; }
  #theme-toggle:hover { opacity: .85; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<header>
  <span class="brand">✻ agent-loop</span>
  <span id="task" title="">waiting for a run…</span>
  <span id="run-state">idle</span>
  <span class="stat">⏱ <b id="elapsed">0s</b></span>
  <span class="stat">$ <b id="cost">0.00</b></span>
  <span id="status">connecting…</span>
  <button id="theme-toggle" type="button" title="Switch look">💬</button>
</header>
<nav id="stepper"></nav>
<div class="body">
  <div id="scroll">
    <main id="transcript"></main>
    <button id="jump">↓ new activity</button>
  </div>
  <aside>
    <h3>Run</h3>
    <div class="kv">Approvals asked <b id="s-asked">0</b></div>
    <div class="kv">Approved / rejected <b id="s-ok">0 / 0</b></div>
    <div class="kv">Auto-allowed by rule <b id="s-auto">0</b></div>
    <div class="kv">Tool calls <b id="s-tools">0</b></div>
    <div id="rules" class="muted"></div>
    <div id="browser-panel"></div>
    <div id="desktop-panel"></div>
    <h3>Files changed</h3>
    <div id="files" class="files"><span class="muted">none yet</span></div>
    <h3>Decisions</h3>
    <div id="decisions"><span class="muted">none yet</span></div>
  </aside>
</div>
<div id="dock"><div class="inner" id="dock-inner"></div></div>

<script>
const PHASES = ["planner", "test-designer", "builder", "verifier", "gatekeeper"];
// Rotates every 8s while idle -- picked by wall-clock time, not per-tick random, so it changes
// slowly instead of flickering every second. Kept light, not edgy: this sits on the same screen as
// destructive-command approval prompts, so the tone stays dry rather than dark.
const IDLE_LINES = [
  "Waiting for a run to start.",
  "Idle. Even the Overseer needs a moment.",
  "No run yet — the calm before the commits.",
  "Standing by. Coffee's probably cold by now.",
  "Idle. Unlike your CI queue, this part's free.",

    ? '<div class="muted">the window as captured · ' + esc(snapId) + ", " + esc(snap.width) + "×" + esc(snap.height) + "</div>" +

// ---------- the bottom dock: permission prompt (Claude Code style) or status line
function promptBody(ev) {
  const i = ev.toolInput || {};

  if (ev.toolName === "Edit") return ["Edit file " + rel(i.file_path), lines(i.old_string, "del", "-") + "\n" + lines(i.new_string, "add", "+")];

      ? '<span class="spin">' + spin + "</span> " + esc(state.phase || "starting") + " is working… <span class=\"muted\">(" + fmtTime(Date.now() - state.startedAt) + " · $" + state.cost.toFixed(2) + ")</span>"
      : state.status === "idle" ? '<span class="muted">' + esc(IDLE_LINES[Math.floor(Date.now() / 8000) % IDLE_LINES.length]) + "</span>"
      : "Run " + esc(state.status) + "." + (state.reportPath ? ' <span class="muted">Saved report: ' + esc(state.reportPath) + "</span>" : "");

      '<div class="statusline">' + status + "</div>" +

    '<div class="prompt" id="prompt" data-request="' + esc(ev.requestId) + '">' +
    '<span class="count">' + esc(countLabel) + "</span>" +
    '<div class="title">' + esc(title) + '</div><div class="body">' + body + "</div>" +
    '<div class="why">' + esc(ev.phase) + " wants to run this" + (ev.rule ? "" : /^mcp__desktop__/.test(ev.toolName) ? " · desktop input: asked every time, one action at a time" : " · chained/complex command: will ask every time") + "</div>" +
    '<div class="q">Do you want to proceed?</div>' +
    opts.map(([k, label], i) => '<button class="opt' + (i === state.sel ? " sel" : "") + '" data-choice="' + k + '"><span class="k">' + (i + 1) + ".</span> " + label + "</button>").join("") +
    '<form class="feedback" id="fb"><input type="text" id="fb-text" placeholder="What should it do instead? (Enter to send, Esc to cancel)" /><button class="smallbtn">Send</button></form>' +
    '<div class="hintline">1–' + opts.length + " or ↑↓ + Enter · y = yes · n / esc = no</div></div>";
  dockInner.querySelectorAll(".opt").forEach((b) => (b.onclick = () => choose(b.dataset.choice)));

function toolBlock(id) { return state.tools.get(id); }
function tagTool(id, cls, text) {
  const t = toolBlock(id); if (!t) return;
  // The exact call waiting on you gets its own pulsing highlight in the transcript, not just the
  // stepper badge -- easy to spot the one that matters even when you're scrolled away from the dock.
  t.classList.toggle("awaiting", cls === "wait");
  let tag = t.querySelector(".tag"); if (!tag) { tag = document.createElement("span"); t.querySelector(".line").appendChild(tag); }
  tag.className = "tag " + cls; tag.textContent = text;
}

function render(ev) {
  if (ev.runId) state.runId = ev.runId;
  if (ev.phase) state.phase = ev.phase;
  switch (ev.type) {
    case "run-start":
      Object.assign(state, { task: ev.task, workDir: ev.workDir || "", status: "running", startedAt: Date.parse(ev.ts), endedAt: null });
      blk("text md", "<strong>Task:</strong> " + md(ev.task));
      break;
    case "run-end":
      state.status = ev.status; state.endedAt = Date.parse(ev.ts);
      blk("run-end " + ev.status,
        "<strong>Run " + esc(ev.status) + "</strong> · " + fmtTime(state.endedAt - state.startedAt) + " · $" + state.cost.toFixed(2) +
        " · " + state.asked + " approval prompts (" + state.approved + " yes, " + state.rejected + " no, " + state.auto + " by rule) · " + state.toolCount + " tool calls");
      break;
    case "phase-start": {
      state.phaseState[ev.phase] = "active";
      const d = document.createElement("div"); d.className = "phase-sep"; d.dataset.phase = ev.phase;
      d.innerHTML = "<b>" + esc(ev.phase) + "</b>" + (ev.attempt > 1 ? " · attempt " + ev.attempt : "");
      add(d);
      break;
    }
    case "phase-end": {
      const v = ev.verdict; const skipped = v.headline === "Skipped";
      state.phaseState[ev.phase] = skipped ? "skipped" : v.outcome === "pass" ? "pass" : "fail";
      const list = (arr, cls) => arr && arr.length ? "<ul class=\"" + cls + "\">" + arr.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "";
      blk("verdict " + (v.outcome === "pass" ? "pass" : "fail"),
        '<span class="head">' + esc(ev.phase) + ": " + esc(v.headline) + '</span> <span class="tag ' + (v.outcome === "pass" ? "ok" : "no") + '">' + esc(skipped ? "skipped" : v.outcome) + "</span>" +
        (v.details ? '<div class="md muted">' + md(short(v.details, 600)) + "</div>" : "") +
        list(v.blockingFindings, "blocking") + list(v.concerns, "muted"));
      break;
    }
    case "overseer-decision": {
      const d = ev.decision;
      if (d.action === "repair") { const t = d.repairTarget || ev.phase; state.repairs[t] = (state.repairs[t] || 0) + 1; }
      blk("overseer", 'Overseer → <span class="act">' + esc(d.action.toUpperCase()) + "</span>" + (d.repairTarget ? " " + esc(d.repairTarget) : "") +
        ' <span class="muted">· ' + esc(d.reasoning) + "</span>" + (d.feedbackForRepair ? '\n<span class="muted">⎿  ' + esc(d.feedbackForRepair) + "</span>" : ""));
      break;
    }
    case "assistant-text":
      // The phase's final ```json verdict block is shown as the verdict line instead.
      { const text = ev.text.replace(/```json[\s\S]*?```\s*$/, "").trim(); if (text) blk("text md", md(text)); }
      break;
    case "thinking":
      if (ev.text) blk("thinking", '<span class="hint">Thinking… (click to expand)</span><span class="full">' + esc(ev.text) + "</span>");
      break;
    case "tool-call": {
      state.toolCount++;
      const [name, args] = toolLabel(ev.toolName, ev.toolInput);
      const el = blk("tool", '<div class="line"><span class="name">' + esc(name) + '</span><span class="args">(' + esc(args) + ")</span></div>");
      state.tools.set(ev.toolUseId, el);
      if (ev.toolName === "Write" || ev.toolName === "Edit") {
        const f = ev.toolInput?.file_path; if (f && !state.files.has(f)) state.files.set(f, ev.toolName);
      }
      break;
    }
    case "tool-result": {
      const t = toolBlock(ev.toolUseId);
      if (t) { t.insertAdjacentHTML("beforeend", outputHtml(ev.summary, ev.isError)); t.classList.add(ev.isError ? "err" : "ok"); if (nearBottom()) scrollBox.scrollTop = scrollBox.scrollHeight; }
      else blk("tool " + (ev.isError ? "err" : "ok"), outputHtml(ev.summary, ev.isError));
      break;
    }
    case "approval-request":
      if (state.pending.some((p) => p.requestId === ev.requestId)) break;
      state.asked++; state.pending.push(ev); tagTool(ev.toolUseId, "wait", "awaiting approval");
      renderDock();
      break;
    case "approval-resolved":
      state.pending = state.pending.filter((p) => p.requestId !== ev.requestId);
      if (ev.decision === "allow") state.approved++; else state.rejected++;
      if (ev.rememberedRule && !state.rules.includes(ev.rememberedRule)) state.rules.push(ev.rememberedRule);
      tagTool(ev.toolUseId, ev.decision === "allow" ? "ok" : "no", ev.decision === "allow" ? (ev.rememberedRule ? "approved · rule saved" : "approved") : "rejected" + (ev.reason ? ": " + short(ev.reason, 60) : ""));
      if (ev.decision === "deny") toolBlock(ev.toolUseId)?.classList.add("denied");
      renderDock();
      break;
    case "approval-auto-allowed":
      state.auto++; tagTool(ev.toolUseId, "ok", /read-only/.test(ev.rule) ? "read-only · no prompt" : "allowed by " + prettyRule(ev.rule));
      break;
    case "usage":
      state.cost += ev.costUsd; state.phaseCost[ev.phase] = (state.phaseCost[ev.phase] || 0) + ev.costUsd;
      break;
    case "report-saved":
      state.reportPath = ev.path;
      if (!REPLAY) blk("note", 'Saved report <span class="muted">· open it any time, no server needed</span>\n<span class="muted">⎿  </span>' + esc(ev.path));
      break;
    case "decisions-log-updated":
      state.decisions = state.decisions.filter((d) => d.trusted).concat([{ text: "DECISIONS.md (worker proposal): " + ev.content.trim().split("\n").slice(-3).join(" "), trusted: false }]);
      blk("note", 'DECISIONS.md updated <span class="muted">· a worker\'s proposal, not settled until you record it below</span>' + outputHtml(ev.content));
      break;
    case "trusted-decision-recorded":
      state.decisions.push({ text: ev.text, trusted: true });
      blk("trusted", "Decision recorded <span class=\"muted\">· the Overseer now treats this as settled</span>\n<span class=\"muted\">⎿  </span>" + esc(ev.text));
      break;
    case "browser-session-started": Object.assign(browserState, { runId: ev.runId, status: "active" }); renderBrowserPanel(browserState); break;
    case "browser-session-ended": browserState.status = ev.status; renderBrowserPanel(browserState); break;
    case "browser-artifact-created":
      if (ev.kind === "video") {
        browserState.video = ev.path; renderBrowserPanel(browserState);
        const lastShot = browserState.history[browserState.history.length - 1]?.shot;
        blk("note", 'Browser session recording <span class="muted">· what the agent actually did in the app</span>' +
          '<video controls preload="metadata" style="display:block;max-width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px"' +
          (lastShot ? ' poster="' + artifactUrl(ev.runId, lastShot) + '"' : "") + ' src="' + artifactUrl(ev.runId, ev.path) + '"></video>');
      }
      break;
    case "desktop-session-started":
      Object.assign(desktopState, { runId: ev.runId, status: "active", driver: ev.driverVersion, target: ev.target.processName + " (pid " + ev.target.pid + ")", targetTitle: short(ev.target.title, 60) });
      blk("note", "Desktop target <span class=\"muted\">· the one window this run may see and operate</span>\n<span class=\"muted\">⎿  </span>" + esc(desktopState.target + ' "' + desktopState.targetTitle + '"'));
      renderDesktopPanel(desktopState);
      break;
    case "desktop-session-ended": desktopState.status = ev.status; renderDesktopPanel(desktopState); break;
    case "desktop-snapshot":
      desktopState.runId = ev.runId;
      desktopState.captures++;
      desktopState.history.push({ shot: ev.screenshotPath, title: ev.title, snapshotId: ev.snapshotId });
      if (desktopState.history.length > DESKTOP_SNAP_CAP) desktopState.history.shift();
      desktopState.bySnapshot.set(ev.snapshotId, { shot: ev.screenshotPath, width: ev.width, height: ev.height, refs: {} });
      if (desktopState.bySnapshot.size > DESKTOP_SNAP_CAP) desktopState.bySnapshot.delete(desktopState.bySnapshot.keys().next().value);
      renderDesktopPanel(desktopState);
      break;
    case "desktop-action-started":
      if (["click", "type_text", "key"].includes(ev.toolName)) { desktopState.actions++; renderDesktopPanel(desktopState); }
      break;
    case "desktop-action-completed":
      if (ev.toolName === "capture" && !ev.isError) {
        // Remember each element's line, so a later "click d3e5" prompt can say what d3e5 is.
        const id = (/Snapshot (dshot-\d+)/.exec(ev.result) || [])[1];
        const snap = id && desktopState.bySnapshot.get(id);
        if (snap) for (const m of String(ev.result).matchAll(/^\s*\[(d\d+e\d+)\] (.+)$/gm)) snap.refs[m[1]] = m[2];
      }
      break;
    case "browser-snapshot":
      browserState.runId = ev.runId;
      browserState.history.push({ shot: ev.screenshotPath, url: ev.url, title: ev.title, ts: ev.ts });
      if (browserState.history.length > SHOT_HISTORY_CAP) browserState.history.shift();
      renderBrowserPanel(browserState);
      break;
    // browser-action-started/-completed duplicate the mcp__browser__* tool-call/result lines already
    // in the transcript; screenshot artifacts are shown through the panel's latest snapshot.
  }
  renderStepper(); renderHeader();
  if (!state.pending.length) renderDock();
}

// ---------- connection
function connect() {
  if (!token) {
    $("status").textContent = "no token — open the full URL agent-loop printed (it ends in #token=…)";
    $("status").className = "down";
    return;
  }
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?token=" + encodeURIComponent(token));
  ws.onopen = () => {
    // The server replays the whole run to every new connection -- clear only once one is actually
    // open, so a server that's gone never leaves you staring at an empty page.
    resetForReplay();
    $("status").textContent = "live"; $("status").className = "live"; state.ws = ws;
  };
  ws.onclose = () => {
    if (state.ws === ws) state.ws = null;
    if (["done", "failed", "stopped"].includes(state.status)) {
      $("status").textContent = "run over · live server stopped"; $("status").className = "down";
      return; // nothing left to reconnect to; the transcript stays as it is
    }
    $("status").textContent = "disconnected — retrying…"; $("status").className = "down";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    if (ev.type === "replay-complete") { state.live = true; scrollBox.scrollTop = scrollBox.scrollHeight; renderDock(); return; }
    render(ev);
  };
}
/** The server replays the whole run on every (re)connect, so start from a clean slate each time. */
function resetForReplay() {
  transcript.innerHTML = ""; state.tools.clear(); state.files.clear();
  Object.assign(state, { phaseState: {}, phaseCost: {}, repairs: {}, pending: [], cost: 0, asked: 0, approved: 0, rejected: 0, auto: 0, toolCount: 0, rules: [], decisions: [], live: false });
}
// ---------- theme: dark terminal-style (default) or a lighter "Desktop" chat-card look
const THEME_KEY = "agent-loop-theme";
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch {}
  const btn = $("theme-toggle");
  btn.textContent = t === "desktop" ? "🖥" : "💬";
  btn.title = t === "desktop" ? "Switch to terminal look" : "Switch to Desktop look";
}
let savedTheme = "terminal";
try { savedTheme = localStorage.getItem(THEME_KEY) || "terminal"; } catch {}
applyTheme(savedTheme);
$("theme-toggle").onclick = () => applyTheme(document.documentElement.dataset.theme === "desktop" ? "terminal" : "desktop");

renderStepper(); renderHeader();
if (REPLAY) {
  $("status").textContent = "saved report";
  for (const ev of REPLAY) render(ev);
  state.live = true;
  renderDock();
} else {
  renderDock();
  connect();
}
</script>
</body>
</html>
