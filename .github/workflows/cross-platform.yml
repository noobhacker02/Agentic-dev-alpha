name: Cross-platform

# The macOS and Windows half of the test matrix. Each suite from `npm test` runs on its own, so the result is a list of which pass on
# each system, not one failure that hides the rest. It was non-blocking (continue-on-error) while the first failures were learned from;
# all 37 suites pass on both now, so it blocks: a green badge here means it, and a red one is a real regression. (A job that is allowed
# to fail reports "success" while suites inside it fail; that is why this flag is gone.) The real-driver desktop tests and the shell
# stress script stay Linux-only: they need X11 and bash.

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: npm run build
      - run: npm run typecheck
      - name: Run each suite, then list which passed
        run: node scripts/run-suites.mjs --timeout-min 10
