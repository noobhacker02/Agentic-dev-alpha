name: Tests

# Everything here runs without an API key: the stores, hooks, approval server, terminal and web UI,
# saved reports, browser tools (driven through a real headless Chromium) and desktop tools (driven
# through the real native driver against a real window, under a virtual display). The
# real-model runs (test/browser-approval.mjs, test/validate-*.mjs, test/e2e/record-run.mjs,
# test/browser-real-sdk.mjs, test/desktop-real-sdk.mjs) cost
# money and stay manual.

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Pipeline edge cases (scripted fake SDK)
        run: bash test/stress/pipeline_logic.sh
      # The real desktop stack: the native driver, real X11 input, a window manager and a native
      # window under a virtual display. REQUIRE_DESKTOP_REAL makes a missing prerequisite a failure,
      # never a silent skip.
      - name: Desktop tools against a real window (Xvfb + openbox)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox at-spi2-core dbus dbus-x11 x11-utils python3-tk python3-gi gir1.2-gtk-3.0
          REQUIRE_DESKTOP_REAL=1 npm run test:desktop-real
